<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://lab271.io" />
		<script>
			location.replace('https://lab271.io/open-source/');
		</script>
		<meta http-equiv="refresh" content="0; url=https://lab271.io/open-source/" />

		<!--
			GitHub Pages serves this file for any path it cannot match, so an old deep
			link into this site lands on the new one rather than on GitHub's 404.

			Same critical path as index.html, in the same order and for the same
			reasons, and this comment sits below it rather than above it so that
			`charset` stays inside the first 1024 bytes. See index.html for the full
			note on why each of those four lines is where it is.

			This responds 404 and then redirects, which is the correct status - the
			requested path really is gone - and every visitor still arrives at
			https://lab271.io/open-source/.

			No rel=canonical here, unlike index.html: this file answers many different
			URLs, and claiming one canonical for all of them would mislead a crawler.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Lab271 open source has moved to lab271.io/open-source/</title>

		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 2rem;
				background: #020c17;
				color: #e8edf2;
				font-family:
					Inter,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Helvetica,
					Arial,
					sans-serif;
				line-height: 1.6;
				text-align: center;
			}
			p {
				margin: 0 0 0.75rem;
			}
			.note {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				font-size: 0.8125rem;
				letter-spacing: 0.06em;
				color: #8fa3b8;
			}
			.slash {
				color: #1ee8ed;
			}
			a {
				color: #1ee8ed;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="note">lab271 <span class="slash">\</span> open source</p>
			<p>
				This site has moved to <a href="https://lab271.io/open-source/">lab271.io/open-source/</a>.
			</p>
			<p class="note">Redirecting. If nothing happens, follow the link above.</p>
		</main>
	</body>
</html>
