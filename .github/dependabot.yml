version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check does not yet support the TypeScript 7 native compiler API.
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
